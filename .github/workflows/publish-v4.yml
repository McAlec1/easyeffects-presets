name: Publish v4 release
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Verify bundled files
        run: |
          sha256sum -c SHA256SUMS.txt
          test "$(find presets -maxdepth 1 -name '*.json' | wc -l)" -eq 55
          python3 - <<'PY'
          import json,pathlib
          for p in pathlib.Path("presets").glob("*.json"):
              data=json.loads(p.read_text())["output"]
              for effect in data["plugins_order"]:
                  assert effect in data, (p,effect)
          print("Validated 55 EasyEffects JSON presets")
          PY
      - name: Package downloadable v4 collection
        run: |
          zip -q -r -X EasyEffects_8.3_Speaker_Collection_v4_55_Presets.zip \
            README.md SHA256SUMS.txt install.sh pebble-changes.csv \
            preset-index-v3.csv preset-index.csv presets
          sha256sum EasyEffects_8.3_Speaker_Collection_v4_55_Presets.zip > EasyEffects_8.3_Speaker_Collection_v4_55_Presets.zip.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v4 >/dev/null 2>&1; then
            echo "v4 release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v4 \
            EasyEffects_8.3_Speaker_Collection_v4_55_Presets.zip \
            EasyEffects_8.3_Speaker_Collection_v4_55_Presets.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "v4 — EasyEffects Speaker Presets (55 profiles)" \
            --notes-file RELEASE_NOTES.md
