name: Validate Presets

on:
  pull_request:
    paths:
      - "presets/**"
      - "tests/**"
      - "install.sh"
      - "index.csv"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CSV index
        run: python3 tests/validate-csv.py
      - name: Validate preset JSON
        run: python3 tests/validate-json.py
      - name: Validate preset structure and index
        run: python3 tests/validate-presets.py
      - name: Validate shell syntax
        run: bash -n install.sh
      - name: Check installer dry run
        run: bash install.sh --dry-run
